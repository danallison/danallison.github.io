title: You are loved. You are free.
volume: 1
author: Dan Allison
trim: {width: 5.83, height: 8.27}  # inches (A5)

copyright: |
  Copyright © 2025 by Dan Allison, licensed under Creative Commons Attribution-NonCommercial 4.0 International. To view a copy of this license, visit https://creativecommons.org/licenses/by-nc/4.0/

  https://danallison.info

dedication: Dedicated to my dear sister Aubrey.

preface: |
  This book is a collection of drawings I made between November 2023 and November 2025.

  Every night on Twitter, I post a new drawing with the words _“You are loved. You are free. Goodnight.”_ I started this nightly ritual with the encouragement of a very insistent dream character and have kept it going since. There have been a few gaps here and there, but mostly I’ve stuck to the nightly schedule.

  This volume does not include all of the drawings I’ve shared through this nightly ritual. Just the highlights in chronological order. If you’d like to see the complete set of drawings, you can do so on my website https://danallison.info/drawings.

  To see my new drawings, you can follow me on Twitter (\@danallison) and subscribe to my newsletter on Substack (https://danallison.substack.com).

  I hope you enjoy this book.

  Dan Allison \
  Seattle, Washington \
  November 2025

